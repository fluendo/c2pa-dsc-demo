version: "3.8"

services:
  server:
    build: .
    image: c2pa-dsc-live-demo
    container_name: dsc-server
    network_mode: host
    ipc: host
    privileged: true
    command: >-
      --server-only
      --whip-server http://0.0.0.0:8190
      --whep-server http://0.0.0.0:8191
    environment:
      - DISPLAY=${DISPLAY}
      - GDK_DEBUG=gl-disable
      - GSK_RENDERER=cairo
      - NO_AT_BRIDGE=1
      - GTK_A11Y=none
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp:/tmp:rw

  source:
    build: .
    image: c2pa-dsc-live-demo
    container_name: dsc-source
    network_mode: host
    ipc: host
    privileged: true
    command: >-
      --source-only
      --whip-server http://127.0.0.1:8190
      --manifest-host ${SERVER_IP:-127.0.0.1}:8765
      --camera-device ${CAMERA_DEVICE:-/dev/video0}
    environment:
      - DISPLAY=${DISPLAY}
      - GDK_DEBUG=gl-disable
      - GSK_RENDERER=cairo
      - NO_AT_BRIDGE=1
      - GTK_A11Y=none
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp:/tmp:rw
      - /opt/fluendo/fluanonymizer:/opt/fluendo/fluanonymizer:ro
    devices:
      - ${CAMERA_DEVICE:-/dev/video0}:${CAMERA_DEVICE:-/dev/video0}
      - /dev/dri:/dev/dri
    depends_on:
      - server

  player:
    build: .
    image: c2pa-dsc-live-demo
    container_name: dsc-player
    network_mode: host
    ipc: host
    privileged: true
    command: >-
      --player-only
      --certs-dir /tmp/c2pa-certs
      --whep-server http://${SERVER_IP:-127.0.0.1}:8191
    environment:
      - DISPLAY=${DISPLAY}
      - GDK_DEBUG=gl-disable
      - GSK_RENDERER=cairo
      - NO_AT_BRIDGE=1
      - GTK_A11Y=none
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp:/tmp:rw
    devices:
      - /dev/dri:/dev/dri
