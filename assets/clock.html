<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluendo UTC Clock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f111a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 3rem 2.5rem;
      background: #181a26;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      max-width: 480px;
      width: 90%;
    }
    .logo {
      max-width: 240px;
      width: 100%;
      height: auto;
      margin-bottom: 2rem;
    }
    .time-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #8a8f9d;
      margin-bottom: 0.5rem;
    }
    .time-display {
      font-size: 2.25rem;
      font-weight: 700;
      font-family: "Courier New", Courier, monospace;
      color: #38ef7d;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo-fluendo.png" alt="Fluendo Logo" class="logo">
    <div class="time-label">Current UTC Time</div>
    <div class="time-display" id="utc-clock">00:00:00 UTC</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getUTCHours()).padStart(2, '0');
      const minutes = String(now.getUTCMinutes()).padStart(2, '0');
      const seconds = String(now.getUTCSeconds()).padStart(2, '0');
      
      document.getElementById('utc-clock').textContent = `${hours}:${minutes}:${seconds} UTC`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
