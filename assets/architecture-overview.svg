<svg xmlns="http://www.w3.org/2000/svg" width="600" height="660" viewBox="0 0 600 660" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: auto; display: block;" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="600" height="660" fill="#ffffff"/>

  <text x="300" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">
    C2PA + DSC WebRTC demo architecture
  </text>

  <!-- ============ LAPTOP GROUPINGS (light / near transparent) ============ -->
  <rect x="48" y="52" width="504" height="380" rx="16" fill="#fafbfc" stroke="#d8dee6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="72" y="78" font-size="12" font-weight="700" fill="#94a3b8">LAPTOP 1</text>

  <rect x="48" y="452" width="504" height="180" rx="16" fill="#fafbfc" stroke="#d8dee6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="72" y="478" font-size="12" font-weight="700" fill="#94a3b8">LAPTOP 2</text>

  <!-- ============ SOURCE ============ -->
  <rect x="120" y="84" width="360" height="130" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="300" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">SOURCE</text>
  <line x1="144" y1="126" x2="456" y2="126" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="300" y="154" text-anchor="middle" font-size="13.5" fill="#334155">Remote camera</text>
  <text x="300" y="176" text-anchor="middle" font-size="13.5" fill="#334155">reporter (iPhone)</text>
  <text x="300" y="200" text-anchor="middle" font-size="11.5" fill="#64748b">captures + signs</text>

  <!-- WHIP arrow -->
  <line x1="300" y1="214" x2="300" y2="258" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="316" y="240" font-size="12" font-weight="700" fill="#2563eb">WHIP</text>

  <!-- ============ SERVER ============ -->
  <rect x="120" y="258" width="360" height="150" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="300" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">SERVER</text>
  <line x1="144" y1="300" x2="456" y2="300" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="300" y="326" text-anchor="middle" font-size="13.5" fill="#334155">streaming bridge</text>

  <rect x="250" y="338" width="100" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="300" y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">WHIP in</text>

  <rect x="250" y="372" width="100" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="300" y="391" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">WHEP out</text>

  <!-- WHEP arrow -->
  <line x1="300" y1="408" x2="300" y2="484" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="316" y="446" font-size="12" font-weight="700" fill="#047857">WHEP</text>

  <!-- ============ PLAYER ============ -->
  <rect x="120" y="484" width="360" height="130" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="300" y="514" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">PLAYER</text>
  <line x1="144" y1="526" x2="456" y2="526" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="300" y="552" text-anchor="middle" font-size="13.5" fill="#334155">client</text>
  <text x="300" y="574" text-anchor="middle" font-size="13.5" fill="#334155">verifies + displays</text>

  <!-- ============ FOOTNOTE ============ -->
  <text x="300" y="650" text-anchor="middle" font-size="11.5" fill="#94a3b8">
    &#128274; CA trust anchor (shared once) &#183; one laptop signs, one laptop verifies
  </text>
</svg>
